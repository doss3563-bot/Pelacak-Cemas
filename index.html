<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25706D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pelacak Cemas</title>
<style>
*{box-sizing:border-box}
:root{--bg:#F1F7F6;--cd:#fff;--ink:#1F3A3A;--mut:#566F6E;--ac:#25706D;--on:#fff;--so:#E4F0EF;--ln:#9DBDB9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#172426;--cd:#1F3236;--ink:#E3EEEC;--mut:#9FB8B5;--ac:#5FB3AD;--on:#0F2A2A;--so:#2B4448;--ln:#476466}}
:root[data-theme=dark]{--bg:#172426;--cd:#1F3236;--ink:#E3EEEC;--mut:#9FB8B5;--ac:#5FB3AD;--on:#0F2A2A;--so:#2B4448;--ln:#476466}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}
body{padding-top:env(safe-area-inset-top,0px)}
main{max-width:480px;margin:0 auto;padding:16px 16px 100px;display:flex;flex-direction:column;gap:14px}
.c{background:var(--cd);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 3px #0002}
h1{margin:0;font-size:24px}h2{margin:0;font-size:16px}
.m{font-size:12px;color:var(--mut);margin:0;line-height:1.4}
.r{display:flex;gap:6px;align-items:center;justify-content:space-between}
.w{flex-wrap:wrap}
button,input{font:inherit;color:inherit}
.b{flex:1;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:var(--so);cursor:pointer}
.b.on{background:var(--ac);color:var(--on)}
.p{min-height:52px;border:0;border-radius:16px;background:var(--ac);color:var(--on);font-weight:700;font-size:16px;cursor:pointer}
.d{border:1px dashed var(--ac);background:transparent;color:var(--ac)}
.s{width:44px;flex:none;font-size:20px;padding:0}
input[type=range]{width:100%;height:32px;accent-color:var(--ac)}
input[type=time],input[type=text]{min-height:44px;padding:0 10px;border:1px solid var(--ln);border-radius:12px;background:var(--cd)}
.k{background:var(--so);border-radius:12px;padding:10px 12px;font-size:13px}
.big{font-size:40px;font-weight:700;color:var(--ac);line-height:1.1}
nav{position:fixed;left:0;right:0;bottom:0;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));background:var(--cd);display:flex;gap:4px;box-shadow:0 -1px 4px #0002}
nav .b{background:transparent;min-height:56px;font-size:11px;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
textarea{width:100%;min-height:64px;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);font:inherit;color:inherit;resize:none}
@media print{nav,.np{display:none}}
nav .b.on{background:var(--so);color:var(--ac)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem('tc')||'null')}catch(e){}
S=S||{name:'Sul',theme:'auto',days:{},l:{mn:['Kopi pahit','Kopi gula','Teh pahit','Teh gula'],cm:['Gorengan']}};
S.l.ol=S.l.ol||['Lari','Jalan','Gym'];S.l.tg=S.l.tg||['Cari kerja','Uang','Tidur kurang','Kesalahan','Keluarga'];S.pm=S.pm||[];let F={tg:[],k:5},RD='',PV='g',PER=28,CF=0,ED=null;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem('tc',JSON.stringify(S))}catch(e){}};
const H=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],B=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const z2=n=>String(n).padStart(2,'0');
const kd=dt=>dt.getFullYear()+'-'+z2(dt.getMonth()+1)+'-'+z2(dt.getDate());
const day=()=>{const k=ED||kd(new Date());return S.days[k]||(S.days[k]={c:[null,null,null],g:{},ob:[0,0],ol:{},mk:{},q:{},sl:[]})};
const f1=n=>(Math.round(n*10)/10+'').replace('.',',');
let v='home';
const bt=(t,on,a,k)=>`<button class="b${on?' on':''}" data-a="${a}" data-k="${k}">${t}</button>`;
const seg=(it,cur,a,k0)=>`<div class="r">${it.map((t,i)=>bt(t,cur===i,a,k0+i)).join('')}</div>`;
const rng=(l,val,k)=>`<div><div class="r"><label for="${k}">${l}</label><b id="v${k}">${val==null?'–':val+'/10'}</b></div><input id="${k}" type="range" min="0" max="10" value="${val||0}" data-r="${k}"></div>`;
const smry=d=>{const f=d.c.filter(x=>x!=null);return f.length?`Rata-rata (otomatis): <b>${f1(f.reduce((a,b)=>a+b,0)/f.length)}</b> · Puncak: <b>${Math.max(...f)}</b>`:'Belum ada skor hari ini'};
const mins=(a,b)=>{const [h1,m1]=a.split(':'),[h2,m2]=b.split(':');return((+h2*60+ +m2)-(+h1*60+ +m1)+1440)%1440};
const dur=m=>Math.floor(m/60)+' j '+m%60+' m';
const peak=dt=>{const d=S.days[kd(dt)];if(!d)return 0;const f=d.c.filter(x=>x!=null);return f.length?Math.max(...f):0};
const warn=()=>{let o=true;for(let i=0;i<(S.wd||3);i++){const dt=new Date();dt.setDate(dt.getDate()-i);if(peak(dt)<(S.wt||7))o=false}return o};
const step=(l,i,d)=>{const nm=S.l[l][i],n=d.q[nm]||0;return `<div class="r"><span>${nm}</span><div class="r"><button class="b s" aria-label="Kurangi ${nm}" data-a="q" data-k="${l}|${i}|-1">-</button><b style="min-width:24px;text-align:center">${n}</b><button class="b s" aria-label="Tambah ${nm}" data-a="q" data-k="${l}|${i}|1">+</button></div></div>`};
const list=(l,t,d)=>S.l[l].map((_,i)=>step(l,i,d)).join('')+`<div class="r"><input type="text" id="ni-${l}" placeholder="${t}" style="flex:1;min-width:0"><button class="b d" style="flex:none" data-a="add" data-k="${l}">Tambah</button></div>`;
function home(){const m7=mean(lastD(7).filter(x=>x.d&&da(x.d)!=null).map(x=>da(x.d))),mp=mean(lastD(14).slice(0,7).filter(x=>x.d&&da(x.d)!=null).map(x=>da(x.d))),dv=m7!=null&&mp!=null?m7-mp:null,d=day(),n=['Pagi','Siang','Malam'],kopi=S.l.mn.reduce((a,x)=>a+(/^Kopi/.test(x)?d.q[x]||0:0),0);
return `<div class="c"><span class="big" id="clk"></span><span class="m" id="dt"></span><h1>Halo, ${S.name.replace(/</g,'&lt;')}</h1></div>
${warn()?'<div class="k">Cemasmu tinggi 3 hari berturut-turut. Pertimbangkan menghubungi dokter atau psikolog.</div>':''}
<div class="c"><h2>Check-in cemas hari ini</h2><div class="r">${n.map((t,i)=>`<span class="b${d.c[i]!=null?' on':''}" style="display:flex;align-items:center;justify-content:center;font-size:13px">${d.c[i]!=null?'✓ ':''}${t}</span>`).join('')}</div><button class="p" data-a="nav" data-k="ci">Isi check-in</button></div>
<div class="c"><h2>Obat</h2><div class="r">${bt('Pagi',d.ob[0],'ob',0)}${bt('Malam',d.ob[1],'ob',1)}</div><p class="m">Ketuk = sudah minum. Tidak diketuk = belum.</p></div>
<div class="r"><button class="b d" data-a="nav" data-k="pem">+ Catat pemicu</button><button class="b d" data-a="nav" data-k="cap">+ Pencapaian kecil</button></div>
<div class="c"><h2>Sekilas minggu ini</h2><div class="r"><div class="k" style="flex:1"><b style="font-size:22px;color:var(--ac)">${fm(da(d))}</b><br>Cemas hari ini (sementara)</div><div class="k" style="flex:1"><b style="font-size:22px;color:var(--ac)">${fm(m7)}</b><br>Rata-rata 7 hari</div></div>${dv!=null?`<p class="m">${Math.abs(dv)<1?'Stabil':dv>0?'Naik '+f1(dv)+' poin':'Turun '+f1(-dv)+' poin'} dibanding minggu lalu.</p>`:''}<button class="b" data-a="nav" data-k="pl">Lihat pola</button></div>`}
function ci(){const d=day(),G=[['kd','Keringat dingin'],['bt','Badan tegang'],['jk','Jantung kencang'],['lt','Lelah terus-menerus']],ol=d.ol,mk=d.mk;
const ds=ED?new Date(ED+'T00:00'):null,bk=ED&&S.bak&&S.bak[ED]!=null&&S.bak[ED]!==JSON.stringify(S.days[ED]||null);
return `${ED?`<div class="c"><h2>Mengedit ${H[ds.getDay()]}, ${ds.getDate()} ${B[ds.getMonth()]}</h2><p class="m">Perubahan tersimpan otomatis. Versi sebelum diedit juga tersimpan, jadi tidak ada data yang hilang.</p>${bk?`<button class="b d" data-a="rs" data-k="${ED}">Tukar dengan versi sebelum diedit</button>`:''}<button class="p" data-a="nav" data-k="rw">Selesai</button></div>`:'<h1>Check-in hari ini</h1>'}
<div class="c"><h2>Tingkat cemas</h2>${['Pagi','Siang','Malam'].map((t,i)=>rng(t,d.c[i],'c'+i)).join('')}<div class="k" id="sm">${smry(d)}</div><p class="m">0-2 tenang · 3-4 ringan · 5-6 mengganggu · 7-8 berat · 9-10 tidak bisa apa-apa</p></div>
<div class="c"><h2>Energi</h2>${rng('Lelah fisik',d.lf,'lf')}<p class="m">0 segar · 5 badan berat tapi jalan terus · 10 tidak sanggup bergerak</p>${rng('Lelah mental',d.lm,'lm')}<p class="m">0 semangat · 5 malas, harus dipaksa · 10 hampa, tidak mau apa-apa</p></div>
<div class="c"><h2>Gejala fisik</h2><p class="m">0 tidak ada · 1 ringan · 2 cukup mengganggu · 3 berat</p>${G.map(([k,t])=>`<div><div style="margin-bottom:6px">${t}</div>${seg(['0','1','2','3'],d.g[k],'g',k+'|')}</div>`).join('')}</div>
<div class="c"><h2>Mood</h2><div class="r w">${['Baik','Biasa','Datar','Cemas','Sedih'].map((t,i)=>bt(t,d.mood===i,'mood',i)).join('')}</div></div>
<div class="c"><h2>Tidur</h2>${d.sl.map((s,i)=>`<div class="r"><input type="time" value="${s.a}" data-t="${i}|a" aria-label="Mulai tidur"><input type="time" value="${s.b}" data-t="${i}|b" aria-label="Bangun"><b>${dur(mins(s.a,s.b))}</b><button class="b s" aria-label="Hapus sesi" data-a="sd" data-k="${i}">×</button></div>`).join('')}${d.sl.length?`<div class="k">Total tidur: <b>${dur(d.sl.reduce((a,s)=>a+mins(s.a,s.b),0))}</b></div>`:''}<button class="b d" data-a="sa">+ Tambah sesi tidur</button></div>
<div class="c"><h2>Obat</h2><div class="r">${bt('Pagi',d.ob[0],'ob',0)}${bt('Malam',d.ob[1],'ob',1)}</div><p class="m">Ketuk = sudah minum. Tidak diketuk = belum.</p></div>
<div class="c"><h2>Olahraga</h2>${bt('Sudah olahraga',ol.on,'ol',0)}${ol.on?`<div>Durasi (menit)</div><div class="r">${[15,30,45,60].map(x=>bt(x,ol.dur===x,'dur',x)).join('')}</div><div>Jenis</div><div class="r w">${S.l.ol.map(x=>bt(esc(x),ol.jn===x,'jn',esc(x))).join('')}</div><div class="r"><input type="text" id="ni-ol" placeholder="Jenis lain, ketik sendiri" style="flex:1;min-width:0"><button class="b d" style="flex:none" data-a="add" data-k="ol">Tambah</button></div>`:''}</div>
<div class="c"><h2>Pola makan</h2>${bt('Sudah makan',mk.on,'mk',0)}${mk.on?`<div>Berapa kali makan berat?</div><div class="r">${[1,2,3,4].map(x=>bt(x==4?'4+':x,mk.n===x,'mkn',x)).join('')}</div>`:''}</div>
<div class="c"><h2>Minuman (gelas)</h2>${list('mn','Minuman lain',d)}<h2>Camilan (porsi)</h2>${list('cm','Camilan lain',d)}<p class="m">Isi sendiri, bisa ditambah atau dikurangi. Kopi dirangkum untuk evaluasi saat kontrol.</p></div>
<button class="b d" data-a="nav" data-k="pem">+ Catat pemicu</button><button class="p" data-a="nav" data-k="home">Simpan check-in</button><p class="m">Tersimpan otomatis di HP ini.</p>`}
function set(){const th=(k,t,bg)=>`<button class="b" style="display:flex;flex-direction:column;gap:6px;padding:6px;height:auto;border:${S.theme==k?'2px solid var(--ac)':'1px solid var(--ln)'};background:var(--cd)" data-a="th" data-k="${k}"><span style="height:40px;width:100%;border-radius:10px;background:${bg}"></span><span style="font-weight:${S.theme==k?700:400}">${t}</span></button>`,
row=(t,sub,k)=>`<button class="b" style="text-align:left;background:transparent;border-top:1px solid var(--so);border-radius:0;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:0;${k?'':'opacity:.55'}" ${k?`data-a="nav" data-k="${k}"`:'disabled'}><span><span style="display:block">${t}</span><span class="m" style="display:block">${sub}</span></span><span aria-hidden="true">›</span></button>`;
return `<h1>Pengaturan</h1><div class="c"><h2>Dasar</h2><label for="nama">Nama sapaan</label><input type="text" id="nama" value="${esc(S.name)}" maxlength="20"><div>Latar</div><div class="r">${th('light','Terang','#F1F7F6')}${th('dark','Gelap','#1E2B2E')}${th('auto','Otomatis','linear-gradient(90deg,#F1F7F6 50%,#1E2B2E 50%)')}</div></div><div class="c" style="gap:0"><h2 style="padding-bottom:8px">Lainnya</h2>${row('Pengingat','Check-in, obat, olahraga','rem')}${row('Peringatan hari berat','Skor '+(S.wt||7)+', '+(S.wd||3)+' hari berturut-turut','wr')}${row('Daftar saya','Tag pemicu, minuman, camilan','ls')}${row('Cadangan dan data','Ekspor dan hapus data','bk')}</div>`}
const RM=[['c0','Check-in pagi','08:00',1],['c1','Check-in siang','13:00',1],['c2','Check-in malam','20:00',1],['o0','Obat pagi','08:00',1],['o1','Obat malam','20:00',1],['ol','Pengingat olahraga','16:00',0],['wk','Ringkasan mingguan (Minggu)','19:00',1],['lk','Sembunyikan isi di layar kunci','',1]];
const rmv=k=>{S.rm=S.rm||{};const r=RM.find(x=>x[0]==k);return S.rm[k]||(S.rm[k]=[r[3],r[2]])};
const swt=k=>{const r=rmv(k),l=RM.find(x=>x[0]==k)[1];return `<div class="r" style="min-height:52px"><span style="flex:1">${l}</span>${r[1]!==''?`<input type="time" value="${r[1]}" data-m="${k}" aria-label="Jam ${l}">`:''}<button class="b${r[0]?' on':''}" style="flex:none;width:68px;padding:0" role="switch" aria-checked="${r[0]?'true':'false'}" aria-label="${l}" data-a="sw" data-k="${k}">${r[0]?'Aktif':'Mati'}</button></div>`};
function ls(){return '<h1>Daftar saya</h1>'+[['tg','Tag pemicu','Tag baru'],['mn','Minuman','Minuman baru'],['cm','Camilan','Camilan baru'],['ol','Jenis olahraga','Olahraga baru']].map(([k,t,ph])=>`<div class="c"><h2>${t}</h2>${S.l[k].map((x,i)=>`<div class="r"><input type="text" value="${esc(x)}" data-n="${k}|${i}" aria-label="Ubah nama ${esc(x)}" style="flex:1;min-width:0"><button class="b s" aria-label="Hapus ${esc(x)}" data-a="ld" data-k="${k}|${i}">×</button></div>`).join('')||'<p class="m">Kosong</p>'}<div class="r"><input type="text" id="ni-${k}" placeholder="${ph}" style="flex:1;min-width:0"><button class="b d" style="flex:none" data-a="add" data-k="${k}">Tambah</button></div></div>`).join('')+'<p class="m">Ketik langsung untuk mengubah nama, ketuk × untuk menghapus.</p>'}
function bk(){return `<h1>Cadangan dan data</h1><div class="c"><h2>Ekspor data</h2><p class="m">Simpan semua catatanmu ke file JSON di HP.</p><button class="p" data-a="ex">Ekspor semua data</button></div><div class="c"><h2>Hapus semua data</h2><p class="m">Menghapus semua catatan di HP ini. Tidak bisa dibatalkan.</p>${CF?'<button class="b" style="border:1px solid #A4572B;color:#A4572B;background:transparent" data-a="dl">Ya, hapus sekarang</button><button class="b" data-a="cf" data-k="0">Batal</button>':'<button class="b d" data-a="cf" data-k="1">Hapus semua data</button>'}</div><div class="k">Cadangan otomatis ke Google Drive menyusul.</div>`}
function rem(){return `<h1>Pengingat</h1><div class="c"><h2>Check-in cemas</h2>${swt('c0')}${swt('c1')}${swt('c2')}</div><div class="c"><h2>Obat</h2>${swt('o0')}${swt('o1')}</div><div class="c"><h2>Lainnya</h2>${swt('ol')}${swt('wk')}${swt('lk')}</div><div class="k">Notifikasi di versi web belum aktif. Pengaturan ini tersimpan dan dipakai di versi Android. Sementara, pakai alarm HP.</div>`}
function wr(){const st=(l,v,a,u)=>`<div class="r"><span>${l}</span><div class="r"><button class="b s" aria-label="Kurangi ${l}" data-a="${a}" data-k="-1">-</button><b style="min-width:56px;text-align:center">${v}${u}</b><button class="b s" aria-label="Tambah ${l}" data-a="${a}" data-k="1">+</button></div></div>`;return `<h1>Peringatan hari berat</h1><div class="c">${st('Skor puncak mulai',S.wt||7,'wt','')}${st('Berturut-turut',S.wd||3,'wd',' hari')}<p class="m">Saran menghubungi dokter muncul jika puncak cemas mencapai nilai ini selama beberapa hari berturut-turut.</p></div>`}
const lastD=n=>{const a=[];for(let i=n-1;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);a.push({dt,d:S.days[kd(dt)]})}return a};
const da=d=>{const f=d.c.filter(x=>x!=null);return f.length?f.reduce((a,b)=>a+b,0)/f.length:null};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fm=x=>x==null?'–':f1(x);
const kop=d=>S.l.mn.reduce((a,x)=>a+(/^Kopi/.test(x)?d.q[x]||0:0),0);
const slm=d=>d.sl.reduce((a,s)=>a+mins(s.a,s.b),0);
const rw=(a,b,h)=>`<div class="r"><span>${a}</span><b style="text-align:right">${b}</b></div>${h?'<p class="m">'+h+'</p>':''}`;
function cmp(t,arr,p,A,Bt){const w=arr.filter(x=>x.d&&da(x.d)!=null),a=w.filter(x=>p(x.d)),b=w.filter(x=>!p(x.d));
return `<div><b>${t}</b>`+(w.length>=14&&a.length>=4&&b.length>=4?rw(A,'rata-rata '+fm(mean(a.map(x=>da(x.d)))))+rw(Bt,'rata-rata '+fm(mean(b.map(x=>da(x.d))))):'<p class="m">Data belum cukup (minimal 14 hari terisi dan 4 hari per kelompok).</p>')+'</div>'}
function cat(m){const d=day(),td=ED||kd(new Date()),L=S.pm.map((x,i)=>[x,i]).filter(p=>p[0].d==td);
const yd=S.days[kd(new Date(Date.now()-864e5))],K=yd&&yd.pc&&yd.pc.length?`<div class="c"><h2>Kemarin (${yd.pc.length})</h2>${yd.pc.map(x=>'<div>✓ '+esc(x)+'</div>').join('')}</div>`:'',wk=lastD(7).map(x=>x.d&&x.d.pc?x.d.pc.length:0),W=`<div class="c"><h2>Minggu ini</h2>${rw('Pencapaian',wk.reduce((a,b)=>a+b,0))}${rw('Hari ada pencapaian',wk.filter(x=>x).length)}</div>`;
const P=`<div class="c"><h2>Catat pemicu</h2><label for="fs">Situasi</label><textarea id="fs" placeholder="Apa yang terjadi?">${esc(F.s)}</textarea>
<div>Tag pemicu</div><div class="r w">${S.l.tg.map(t=>bt(esc(t),F.tg.includes(t),'tg',esc(t))).join('')}</div>
<div class="r"><input type="text" id="ni-tg" placeholder="Tag baru" style="flex:1;min-width:0"><button class="b d" style="flex:none" data-a="add" data-k="tg">Tambah</button></div>
<label for="fp">Pikiran otomatis</label><textarea id="fp" placeholder="Apa yang terlintas?">${esc(F.p)}</textarea>
<label for="fb">Versi seimbang (opsional)</label><textarea id="fb" placeholder="Versi yang lebih realistis">${esc(F.b)}</textarea>
${rng('Cemas saat itu',F.k,'fk')}<p class="m">0-2 tenang · 3-4 ringan · 5-6 mengganggu · 7-8 berat · 9-10 tidak bisa apa-apa</p><button class="p" data-a="pm">Simpan pemicu</button></div>
